<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>给 TA 装饰一棵圣诞树</title><style>
:root{--accent:#9deaff;--ink:#eef7ff;--muted:#9bb4cc}*{box-sizing:border-box}body{margin:0;background:#020611;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;min-height:100vh}body.nebula{--accent:#e7a2ff}body.gold{--accent:#ffd27b}.app{max-width:560px;margin:auto;padding:18px 14px 30px}.brand{text-align:center}.brand h1{margin:4px 0 5px;font-size:24px;text-shadow:0 0 20px var(--accent)}.brand p{margin:0 0 12px;color:var(--muted);font-size:12px;letter-spacing:.2em}.panel{background:rgba(8,15,30,.72);border:1px solid #29405b;border-radius:20px;padding:12px;margin:12px 0;backdrop-filter:blur(10px)}.scene{position:relative;height:min(124vw,650px);min-height:440px;border-radius:16px;overflow:hidden;background:#020611}.scene canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.toolbar,.themes{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tool,.theme-btn,.subbtn,.primary{border:1px solid #37516b;background:#0c1a2b;color:var(--ink);border-radius:999px;padding:8px 11px;font:inherit;font-size:12px;cursor:pointer}.tool.active,.theme-btn.active{border-color:var(--accent);box-shadow:0 0 14px var(--accent)}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea,.output{width:100%;padding:10px;border-radius:11px;border:1px solid #29405b;background:#050c18;color:var(--ink);font:inherit;font-size:15px}.field textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{width:100%;padding:12px;background:linear-gradient(120deg,var(--accent),#fff);color:#06111d;font-weight:800}.error{color:#ff8999;font-size:12px;min-height:18px}.output-wrap{display:none}.output{min-height:72px;font-size:11px}.receiver{text-align:center;padding:18px 14px}.receiver h1{font-size:25px;text-shadow:0 0 22px var(--accent)}.sub{letter-spacing:.3em;color:var(--accent);font-style:italic}.photo{width:min(72%,260px);margin:16px auto;background:#fff;padding:9px 9px 28px;transform:rotate(-2deg);box-shadow:0 12px 30px #000}.photo img{width:100%;display:block}.letter-btn{margin:12px 6px 0;padding:12px 20px;border:0;border-radius:999px;background:linear-gradient(120deg,var(--accent),#fff);font-weight:800;cursor:pointer;color:#06111d}.letter{display:none;text-align:left;background:#fff8e7;color:#4b3426;padding:24px 18px;line-height:1.8;white-space:pre-wrap;border-radius:8px;margin-top:14px}.back{margin-top:18px}.back a{color:var(--accent)}
.starsea-photo{position:absolute;left:50%;top:50%;width:56%;transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;transition:opacity 1.1s ease,transform 1.1s ease;border:3px solid #ffd76a;border-radius:10px;box-shadow:0 0 34px rgba(255,205,80,.75),0 0 90px rgba(255,180,60,.35);overflow:hidden;background:#0a1424;z-index:5}
.starsea-photo.on{opacity:1;transform:translate(-50%,-50%) scale(1.03)}
.starsea-photo img{display:block;width:100%}
.starsea-photo .sea-title{padding:34px 14px;font-size:19px;font-weight:800;color:#ffe9a8;text-shadow:0 0 16px rgba(255,200,80,.8);letter-spacing:.06em}
</style></head><body><main id="root"></main><script>
const ALPHABET='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let state={v:1,theme:'ice',to:'',from:'',letter:'',photo:'',ornaments:[]},selected='ball',keyValue='';
function enc(s){return btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(x){try{return JSON.parse(decodeURIComponent(escape(atob(x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-x.length%4)%4)))))}catch(e){return null}}
function validKey(k){const m=k.trim().match(/^XT-([A-Z0-9]{6})$/);if(!m)return false;const a=m[1];if([...a].some(c=>!ALPHABET.includes(c)))return false;let s=0;for(let i=0;i<5;i++)s+=(i+1)*ALPHABET.indexOf(a[i]);return s%31===ALPHABET.indexOf(a[5])}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const palettes={ice:['#bff6ff','#75cfff','#ffffff'],nebula:['#ff9ff5','#b88cff','#9fe8ff'],gold:['#ffe28a','#ffad4d','#fff3c4']};
let activeEngine=null;
class Engine{
  constructor(canvas){if(activeEngine)activeEngine.stop();this.c=canvas;this.x=canvas.getContext('2d');this.t=0;this.phase=0;this.vel=0;this.m=0;this.mTarget=0;this.seaHold=0;this.flashes=[];this.onSea=null;this.last=0;this.resize();this.init();this.run=this.run.bind(this);this.raf=requestAnimationFrame(this.run);addEventListener('resize',()=>this.resize());activeEngine=this}
  stop(){cancelAnimationFrame(this.raf)}
  resize(){const r=this.c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);this.c.width=Math.max(50,r.width*d);this.c.height=Math.max(50,r.height*d);this.w=r.width;this.h=r.height;this.d=d}
  init(){const narrow=this.w<430,total=narrow?2500:4600,tn=Math.round(total*0.64),dn=total-tn;
    this.tree=[];for(let i=0;i<tn;i++){const arm=i%10>=7;const t=Math.pow(Math.random(),0.92);let th;
      if(arm){const armOff=(i%2)*Math.PI;th=t*Math.PI*2*3+armOff+(Math.random()+Math.random()-1)*0.3}else th=Math.random()*Math.PI*2;
      this.tree.push({t,th,rf:arm?0.93+Math.random()*0.07:0.30+Math.random()*0.70,ci:(Math.random()*3)|0,sz:arm?1.5+Math.random()*0.9:1+Math.random()*1.3,ph:Math.random()*6.28,sx:0.05+Math.random()*0.9,sy:0.05+Math.random()*0.9})}
    this.disc=[];for(let i=0;i<dn;i++){const armD=i%2===0;const u=Math.sqrt(Math.random());this.disc.push({u,th:armD?(u*Math.PI*3.2+(i%4===0?0:Math.PI)+(Math.random()+Math.random()-1)*0.45):Math.random()*Math.PI*2,ci:(Math.random()*3)|0,sz:1.0+Math.random()*1.5,ph:Math.random()*6.28})}
    this.stars=[];for(let i=0;i<170;i++)this.stars.push({x:Math.random(),y:Math.random(),a:0.18+Math.random()*0.52,sz:Math.random()<0.12?1.8:1});
    this.snow=[];for(let i=0;i<120;i++)this.snow.push({x:Math.random(),y:Math.random(),v:0.03+Math.random()*0.09,p:Math.random()*6.28,sz:1+Math.random()*2})}
  setSea(on){this.mTarget=on?1:0;this.seaHold=0;this.seaT0=performance.now();this.mFrom=this.m;if(this.onSea)this.onSea(on)}
  flash(x,y){this.flashes.push({x,y,t0:performance.now()})}
  run(ts){this.raf=requestAnimationFrame(this.run);if(document.hidden){this.last=ts;return}
    const dtR=this.last?Math.min(1,(ts-this.last)/1000):0.016;const dt=Math.min(0.05,dtR);this.last=ts;this.t=ts*0.001;
    this.phase+=dt*0.12+this.vel*dt;this.vel*=Math.pow(0.1,dt);
    if(this.mTarget===1&&this.m>0.97){this.seaHold+=dtR;if(this.seaHold>3.5)this.setSea(false)}
    if(this.seaT0!==undefined){const pr=Math.max(0,Math.min(1,(ts-this.seaT0)/1200));this.m=this.mFrom+(this.mTarget-this.mFrom)*pr}
    this.draw()}
  draw(){const x=this.x,w=this.w,h=this.h,d=this.d,pal=palettes[state.theme]||palettes.ice;
    x.setTransform(d,0,0,d,0,0);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#020713');g.addColorStop(1,'#060b1a');x.fillStyle=g;x.fillRect(0,0,w,h);
    const cx=w/2,baseY=h*0.84,treeH=h*0.74,topY=baseY-treeH,baseR=w*0.40,discR=w*0.47,m=this.m,e=m*m*(3-2*m);
    x.globalCompositeOperation='lighter';
    for(const s of this.stars){x.globalAlpha=s.a*(1-m*0.6);x.fillStyle='#cfe8ff';x.fillRect(s.x*w,s.y*h,s.sz,s.sz)}
    // nebula disc (fades out in starsea mode)
    if(m<0.98){const fe=1-e;x.save();x.translate(cx,baseY);x.scale(1,0.30);const dR=discR*1.15,dg=x.createRadialGradient(0,0,0,0,0,dR);dg.addColorStop(0,pal[2]+'5c');dg.addColorStop(0.3,pal[1]+'33');dg.addColorStop(0.68,pal[0]+'14');dg.addColorStop(1,pal[0]+'00');x.globalAlpha=fe;x.fillStyle=dg;x.beginPath();x.arc(0,0,dR,0,7);x.fill();x.restore();
for(const q of this.disc){const a=q.th+this.phase*0.6,rho=q.u*discR;const px=cx+Math.cos(a)*rho,py=baseY+Math.sin(a)*rho*0.26;const dp=0.72+0.28*(Math.sin(a)+1)/2,tw=0.8+0.2*Math.sin(this.t*1.9+q.ph);
x.globalAlpha=Math.min(1,(0.26+0.6*(1-q.u))*dp*tw)*fe;x.fillStyle=pal[q.ci];x.shadowBlur=q.u<0.55?7:4;x.shadowColor=x.fillStyle;x.beginPath();x.arc(px,py,q.sz*(0.85+0.4*(1-q.u)),0,7);x.fill()}x.shadowBlur=0}
    // gift boxes at disc front edge
    if(m<0.5){this.gift(cx-discR*0.58,baseY+discR*0.13,w*0.085,pal[1],pal[2]);this.gift(cx+discR*0.52,baseY+discR*0.19,w*0.105,'#e8b34b','#ffe9a8');this.gift(cx+discR*0.82,baseY+discR*0.07,w*0.07,pal[0],pal[2])}
    // tree particles (lerp to starsea positions)
    for(const q of this.tree){const R=baseR*Math.pow(1-q.t,0.85)*(0.94+0.06*Math.sin(q.t*Math.PI*6));const r=R*q.rf;const a=q.th+this.phase;
      const depth=(Math.sin(a)+1)/2;let px=cx+Math.cos(a)*r,py=baseY-q.t*treeH;
      if(e>0){px=px*(1-e)+q.sx*w*e;py=py*(1-e)+q.sy*h*e}
      const tw=0.72+0.28*Math.sin(this.t*2.2+q.ph);x.globalAlpha=Math.min(1,(0.22+0.62*depth)*tw+e*0.25);x.fillStyle=pal[q.ci];x.shadowBlur=6;x.shadowColor=x.fillStyle;
      x.beginPath();x.arc(px,py,q.sz*(0.75+0.45*depth),0,7);x.fill()}
    x.shadowBlur=0;
    // snow
    for(const q of this.snow){q.y=(q.y+q.v*0.016)%1;const px=(q.x+Math.sin(this.t*0.9+q.p)*0.008)*w,py=q.y*h;x.globalAlpha=0.35+0.4*q.v/0.12;x.fillStyle='#eaf7ff';x.beginPath();x.arc(px,py,q.sz,0,7);x.fill()}
    // ornaments (editor coordinates, absolute)
    x.globalCompositeOperation='source-over';x.globalAlpha=1;const OC={ball:'#ff6d9b',star:'#ffe98a',heart:'#ff719d',snow:'#c9f5ff'};
for(const o of state.ornaments||[]){const px=o.x/1000*w,py=o.y/1000*h,col=OC[o.t]||'#ffd36e',R=14;
x.save();x.globalCompositeOperation='lighter';const og=x.createRadialGradient(px,py,0,px,py,R*2.1);og.addColorStop(0,col+'55');og.addColorStop(0.5,col+'22');og.addColorStop(1,col+'00');x.fillStyle=og;x.beginPath();x.arc(px,py,R*2.1,0,7);x.fill();x.restore();
x.shadowBlur=12;x.shadowColor=col;drawOrn(x,o.t,px,py,R)}
x.shadowBlur=0;x.globalCompositeOperation='lighter';
    x.shadowBlur=0;
    // placement flashes
    const now=performance.now();this.flashes=this.flashes.filter(f=>now-f.t0<450);
    for(const f of this.flashes){const p=(now-f.t0)/450;x.globalAlpha=0.8*(1-p);x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.arc(f.x,f.y,6+p*22,0,7);x.stroke()}
    // top star (brightest point) — fades in starsea
    if(m<0.6){const pulse=1+0.15*Math.sin(this.t*2.4),sa=1-e*1.6;if(sa>0){x.save();x.translate(cx,topY);x.globalAlpha=Math.max(0,sa);
      const hg=x.createRadialGradient(0,0,0,0,0,66);hg.addColorStop(0,'rgba(255,255,255,.95)');hg.addColorStop(0.22,pal[2]+'66');hg.addColorStop(0.55,pal[1]+'1f');hg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=hg;x.beginPath();x.arc(0,0,66,0,7);x.fill();
      x.fillStyle=pal[2];const beam=(len,wid,rot)=>{x.save();x.rotate(rot);const bg=x.createLinearGradient(-len,0,len,0);bg.addColorStop(0,'rgba(255,255,255,0)');bg.addColorStop(0.5,'rgba(255,255,255,.95)');bg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=bg;x.fillRect(-len,-wid/2,len*2,wid);x.restore()};
      beam(38*pulse,3.2,0);beam(27*pulse,2.6,Math.PI/2);
      x.fillStyle='#fff';x.shadowBlur=30;x.shadowColor='#fff';x.beginPath();x.arc(0,0,6.5*pulse,0,7);x.fill();x.restore()}}
    x.globalAlpha=1;x.globalCompositeOperation='source-over'}
  gift(gx,gy,s,body,ribbon){const x=this.x;x.save();x.translate(gx,gy);x.shadowBlur=13;x.shadowColor=body;x.fillStyle=body;
    const wB=s,hB=s*0.62;x.beginPath();x.roundRect(-wB/2,-hB*0.28,wB,hB,3);x.fill();x.fillRect(-wB/2-2,-hB*0.52,wB+4,hB*0.26);
    x.shadowBlur=0;x.fillStyle=ribbon;x.fillRect(-1.6,-hB*0.52,3.2,hB*1.24);x.fillRect(-wB/2-2,-hB*0.40,wB+4,3);
    x.beginPath();x.ellipse(-s*0.13,-hB*0.62,s*0.11,s*0.06,-0.5,0,7);x.ellipse(s*0.13,-hB*0.62,s*0.11,s*0.06,0.5,0,7);x.fill();x.restore()}
}
function drawOrn(x,t,px,py,r){x.save();x.translate(px,py);x.lineWidth=2;
  if(t==='ball'){const bg=x.createRadialGradient(-r*0.35,-r*0.4,r*0.1,0,0,r);bg.addColorStop(0,'#ffd0e0');bg.addColorStop(0.45,'#ff6d9b');bg.addColorStop(1,'#c23a6a');x.fillStyle=bg;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.ellipse(-r*0.38,-r*0.42,r*0.22,r*0.13,-0.6,0,7);x.fill();x.fillStyle='#ffd36e';x.fillRect(-r*0.25,-r-3,r*0.5,4)}
else if(t==='star'){const sg=x.createRadialGradient(0,0,0,0,0,r);sg.addColorStop(0,'#fff7cf');sg.addColorStop(0.5,'#ffe98a');sg.addColorStop(1,'#f0b93a');x.fillStyle=sg;x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:r*0.42;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill();x.shadowBlur=0;x.lineWidth=1;x.strokeStyle='#fff3c4';x.stroke()}
else if(t==='heart'){const hg=x.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r*1.1);hg.addColorStop(0,'#ffc2d6');hg.addColorStop(0.5,'#ff719d');hg.addColorStop(1,'#c8406b');x.fillStyle=hg;x.beginPath();x.moveTo(0,r);x.bezierCurveTo(-r*1.5,0,-r,-r,0,-r*0.3);x.bezierCurveTo(r,-r,r*1.5,0,0,r);x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.ellipse(-r*0.45,-r*0.35,r*0.18,r*0.1,-0.7,0,7);x.fill()}
else if(t==='snow'){x.strokeStyle='#c9f5ff';x.lineWidth=2.2;x.lineCap='round';for(let i=0;i<3;i++){x.save();x.rotate(i*Math.PI/3);x.beginPath();x.moveTo(-r,0);x.lineTo(r,0);for(const s of[-1,1]){const bx=s*r*0.58;x.moveTo(bx,0);x.lineTo(bx+s*r*0.26,-r*0.26);x.moveTo(bx,0);x.lineTo(bx+s*r*0.26,r*0.26)}x.stroke();x.restore()}x.fillStyle='#eafcff';x.beginPath();x.arc(0,0,r*0.16,0,7);x.fill()}
else{const bg=x.createLinearGradient(-r,0,r,0);bg.addColorStop(0,'#c98a22');bg.addColorStop(0.45,'#ffe39a');bg.addColorStop(1,'#d9962c');x.fillStyle=bg;x.beginPath();x.moveTo(-r*0.85,r*0.6);x.quadraticCurveTo(-r*0.75,-r*0.8,0,-r*0.8);x.quadraticCurveTo(r*0.75,-r*0.8,r*0.85,r*0.6);x.closePath();x.fill();x.fillStyle='#ffd36e';x.beginPath();x.ellipse(0,r*0.6,r*0.92,r*0.16,0,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#a8691a';x.beginPath();x.arc(0,r*0.8,r*0.18,0,7);x.fill();x.strokeStyle='#ffe7a8';x.lineWidth=1.8;x.beginPath();x.arc(0,-r*0.98,3.5,0,7);x.stroke()}
  x.restore()}
function scene(){return '<div class="scene"><canvas id="cv"></canvas></div>'}
function attachPointer(cv,eng,onTap){let downX=0,downY=0,lastX=0,dragged=false,downT=0;
  cv.onpointerdown=e=>{downX=lastX=e.clientX;downY=e.clientY;dragged=false;downT=performance.now();try{cv.setPointerCapture(e.pointerId)}catch(_){}};
  cv.onpointermove=e=>{if(downT===0)return;const dx=e.clientX-lastX;lastX=e.clientX;
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>8)dragged=true;
    if(dragged){eng.phase+=dx*0.007;eng.vel=dx*0.35}};
  cv.onpointerup=e=>{const wasDrag=dragged;downT=0;if(!wasDrag&&performance.now()-downT<1e9&&onTap)onTap(e);dragged=false}}
function renderEditor(){root.innerHTML='<div class="app"><header class="brand"><h1>给 TA 装饰一棵圣诞树</h1><p>把祝福挂上枝头，再交给重要的人</p></header><section class="panel">'+scene()+'<div class="toolbar">'+[['ball','光球'],['star','星星'],['heart','爱心'],['snow','雪花'],['bell','铃铛']].map(a=>'<button class="tool '+(selected===a[0]?'active':'')+'" data-t="'+a[0]+'">'+a[1]+'</button>').join('')+'</div><div class="toolbar"><button class="subbtn" id="undo">撤销</button><button class="subbtn" id="clear">清空</button></div></section><section class="panel"><div class="themes">'+[['ice','冰蓝'],['nebula','紫粉星云'],['gold','鎏金']].map(a=>'<button class="theme-btn '+(state.theme===a[0]?'active':'')+'" data-theme="'+a[0]+'">'+a[1]+'</button>').join('')+'</div><div class="row"><div class="field"><label>送给谁</label><input id="to" value="'+esc(state.to)+'"></div><div class="field"><label>署名</label><input id="from" value="'+esc(state.from)+'"></div></div><div class="field"><label>一封信</label><textarea id="letter">'+esc(state.letter)+'</textarea></div><div class="field"><label>照片</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>卡密</label><input id="key" value="'+esc(keyValue)+'" placeholder="XT-XXXXXX"><div id="err" class="error"></div></div><button class="primary" id="generate">生成专属链接</button><div class="output-wrap" id="ow"><textarea id="out" class="output" readonly></textarea><button id="copy" class="subbtn">复制链接</button></div></section></div>';
  const cv=document.getElementById('cv'),eng=new Engine(cv);
  attachPointer(cv,eng,e=>{const r=cv.getBoundingClientRect();if(state.ornaments.length>=30)return;
    const ox=Math.round((e.clientX-r.left)/r.width*1000),oy=Math.round((e.clientY-r.top)/r.height*1000);
    state.ornaments.push({t:selected,x:ox,y:oy});eng.flash((ox/1000)*r.width,(oy/1000)*r.height)});
  document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{selected=b.dataset.t;document.querySelectorAll('.tool').forEach(z=>z.classList.toggle('active',z===b))});
  document.querySelectorAll('.theme-btn').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;document.body.className=state.theme==='ice'?'':state.theme;renderEditor()});
  undo.onclick=()=>{state.ornaments.pop()};clear.onclick=()=>{state.ornaments=[]};
  key.oninput=()=>keyValue=key.value;
  photo.onchange=e=>{const f=e.target.files[0];if(f)resizePhoto(f,480,0.6,d=>state.photo=d)};
  generate.onclick=()=>{state.to=to.value;state.from=from.value;state.letter=letter.value;err.textContent='';
    if(!validKey(keyValue)){err.textContent='卡密不对，检查一下或联系卖家';return}
    let u=location.href.split('#')[0]+'#d='+enc(state);
    if(u.length>50000&&state.photo)resizePhoto(null,360,0.5,d=>{state.photo=d;show()});else show()};
  function show(){ow.style.display='block';out.value=location.href.split('#')[0]+'#d='+enc(state)}
  copy.onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(out.value).catch(()=>{})}}
function resizePhoto(file,max,q,cb){const rd=new FileReader();
  if(file){rd.onload=()=>load(rd.result);rd.readAsDataURL(file)}else load(state.photo);
  function load(src){const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};i.src=src}}
function renderReceiver(){root.innerHTML='<div class="receiver"><div class="sub">MERRY CHRISTMAS</div><h1>送给 '+esc(state.to||'你')+' 的圣诞树</h1><div class="panel">'+scene()+(state.photo?'<div class="photo"><img src="'+state.photo+'"></div>':'')+'<div><button id="seaBtn" class="letter-btn">✨ 星海时刻</button><button id="lb" class="letter-btn">✉ 点开 TA 写给你的信</button></div><div id="lp" class="letter">'+esc(state.letter||'愿你的每一天都有微小的闪光。')+'\n\n—— '+esc(state.from||'送礼人')+'</div></div><p class="back"><a href="'+location.href.split('#')[0]+'">我也送一棵 →</a></p></div>';
  const sceneEl=document.querySelector('.scene');
  sceneEl.insertAdjacentHTML('beforeend','<div class="starsea-photo" id="seaBox">'+(state.photo?'<img src="'+state.photo+'">':'<div class="sea-title">送给 '+esc(state.to||'你')+' 的圣诞树</div>')+'</div>');
  const cv=document.getElementById('cv'),eng=new Engine(cv),seaBox=document.getElementById('seaBox');
  eng.onSea=on=>seaBox.classList.toggle('on',on);
  attachPointer(cv,eng,e=>{const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;
    const cx=r.width/2,topY=r.height*0.10;if(Math.hypot(px-cx,py-topY)<72)eng.setSea(eng.mTarget<0.5)});
  seaBtn.onclick=()=>eng.setSea(eng.mTarget<0.5);
  lb.onclick=()=>lp.style.display=lp.style.display==='block'?'none':'block'}
const h=location.hash.match(/^#d=(.+)$/);
if(h){const d=dec(h[1]);if(d){state=Object.assign(state,d);document.body.className=state.theme==='ice'?'':state.theme;renderReceiver()}else root.innerHTML='<div class="receiver"><h1>链接好像不完整</h1></div>'}
else renderEditor();
</script></body></html>

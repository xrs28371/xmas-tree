<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>给 TA 装饰一棵圣诞树</title>
<style>
:root{--bg:#050b12;--bg2:#163845;--au1:rgba(31,138,91,.22);--au2:rgba(232,93,93,.14);--ink:#fff8e8;--muted:#a9c0bf;--accent:#e85d5d;--accent2:#f6c85f;--accent-a:rgba(232,93,93,.5);--on-accent:#2a110c;--glow:#ffd66e;--glow-a:rgba(255,214,110,.45);--tree:#155c45;--tree2:#2f9d66;--tree3:#0a3227;--tree-hi:rgba(170,255,200,.2);--l0:#ff4d5e;--l1:#ffd45c;--l2:#5fe0ff;--orn-a:#e23d4f;--orn-b:#1f9a63;--gold:#f6c85f;--flake:#f4fcff;--flake2:#7fc7e6;--cream:#fff8ef;--skirt:#b3262f;--skirt2:#e04a55;--seal:#b3262f;--sky1:#030d18;--sky2:#0a2532;--sky3:#1d4a55;--moon:rgba(255,236,180,.3);--snow1:#f1fbf9;--snow2:#cfe6e5;--snow3:#7fa6ad;--line:rgba(255,255,255,.14);--snow:#dff7ff;--panel:#10242b}
body.ice{--bg:#050f1f;--bg2:#17406a;--au1:rgba(110,214,255,.2);--au2:rgba(200,240,255,.12);--muted:#a9c6d8;--accent:#6ed6ff;--accent2:#e8fbff;--accent-a:rgba(110,214,255,.5);--on-accent:#062438;--glow:#b8f4ff;--glow-a:rgba(184,244,255,.5);--tree:#1f5b78;--tree2:#78c4d8;--tree3:#0d3049;--tree-hi:rgba(225,250,255,.28);--l0:#bff3ff;--l1:#ffffff;--l2:#62bfff;--orn-a:#4fc0ef;--orn-b:#2b78b8;--gold:#e2f1fb;--flake:#ffffff;--flake2:#56b8ec;--skirt:#cfe6f5;--skirt2:#ffffff;--seal:#2f7fc0;--sky1:#030c1d;--sky2:#0d2c50;--sky3:#2a5d88;--moon:rgba(210,245,255,.36);--snow1:#f6fcff;--snow2:#d0e6f7;--snow3:#7fa3c8;--panel:#102d47}
body.purple{--bg:#08051a;--bg2:#2c1652;--au1:rgba(216,124,255,.2);--au2:rgba(255,210,110,.1);--muted:#bfb0d6;--accent:#d87cff;--accent2:#ffd26e;--accent-a:rgba(216,124,255,.5);--on-accent:#2a0e3a;--glow:#f0b7ff;--glow-a:rgba(240,183,255,.45);--tree:#3b246f;--tree2:#8a57c9;--tree3:#1c1040;--tree-hi:rgba(245,205,255,.22);--l0:#f08bff;--l1:#ffd26e;--l2:#9d86ff;--orn-a:#c05cf5;--orn-b:#5b37b0;--gold:#ffd26e;--flake:#f7eaff;--flake2:#b48cff;--skirt:#5a2d91;--skirt2:#8b4fd0;--seal:#7d2fb8;--sky1:#06030f;--sky2:#1d0f38;--sky3:#3d2566;--moon:rgba(255,215,150,.26);--snow1:#f5f0ff;--snow2:#d5caee;--snow3:#8577b0;--panel:#291844}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(120% 55% at 50% -12%,var(--bg2),transparent 62%),radial-gradient(70% 45% at -10% 35%,var(--au1),transparent 70%),radial-gradient(70% 45% at 110% 72%,var(--au2),transparent 70%),var(--bg);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background:radial-gradient(#fff 1px,transparent 1.3px) 0 0/53px 53px,radial-gradient(rgba(255,255,255,.7) .8px,transparent 1.1px) 26px 31px/89px 89px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
.app{position:relative;width:min(100%,480px);margin:auto;padding:24px 14px 34px}
.brand{text-align:center;margin:4px 0 16px}
.brand h1{display:inline-flex;align-items:center;gap:10px;margin:0 0 8px;font-size:24px;font-weight:800;letter-spacing:.14em;text-shadow:0 0 14px var(--glow-a),0 0 34px var(--glow-a),0 2px 0 rgba(0,0,0,.35)}
.mini{width:22px;height:26px;flex:none;filter:drop-shadow(0 0 6px var(--glow-a))}
.mini .m1{fill:var(--tree2)}.mini .m2{fill:var(--gold)}.mini .m3{fill:#7a4a2c}.mini .m4{fill:var(--l0)}.mini .m5{fill:var(--l2)}.mini .m6{fill:var(--l1)}
.brand p{margin:0;color:var(--muted);font-size:12px;letter-spacing:.22em}
.panel{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);border-radius:26px;padding:14px;margin-bottom:14px;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.14)}
.scene-wrap{position:relative;height:400px;border-radius:20px;overflow:hidden;cursor:crosshair;isolation:isolate;background:radial-gradient(circle at 84% 12%,#fff6dc 0 13px,rgba(255,240,205,.55) 14px,transparent 17px),radial-gradient(55% 38% at 84% 12%,var(--moon),transparent 70%),linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.scene-wrap:before{content:"";position:absolute;inset:0 0 35% 0;pointer-events:none;opacity:.8;background:radial-gradient(1.2px 1.2px at 9% 14%,#fff 50%,transparent),radial-gradient(1px 1px at 22% 32%,#fff 50%,transparent),radial-gradient(1.4px 1.4px at 35% 9%,#fff 50%,transparent),radial-gradient(1px 1px at 61% 22%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 70% 38%,#fff 50%,transparent),radial-gradient(1px 1px at 93% 30%,#fff 50%,transparent),radial-gradient(1.3px 1.3px at 15% 52%,#fff 50%,transparent),radial-gradient(1px 1px at 88% 55%,#fff 50%,transparent)}
.scene-wrap:after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 50px rgba(0,0,0,.45)}
.ground{position:absolute;left:0;bottom:0;width:100%;height:27%;z-index:1;pointer-events:none;filter:drop-shadow(0 -6px 14px rgba(255,255,255,.14))}
.ground .s3{fill:var(--snow3);opacity:.7}.ground .s2{fill:var(--snow2)}.ground .s1{fill:var(--snow1)}
.snowflake{position:absolute;top:-8px;z-index:6;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0 35%,rgba(255,255,255,.55) 55%,transparent 72%);box-shadow:0 0 6px rgba(255,255,255,.45);animation:fall linear infinite}
.tree{position:absolute;left:50%;top:12%;width:78%;height:75%;transform:translateX(-50%);z-index:2}
.tier{position:absolute;left:50%;transform:translateX(-50%);filter:drop-shadow(0 6px 5px rgba(0,0,0,.42))}
.tier b{position:absolute;inset:0;clip-path:polygon(50% 0,99% 90%,100% 94%,91% 100%,83% 95%,75% 100%,67% 95%,58% 100%,50% 95%,42% 100%,33% 95%,25% 100%,17% 95%,9% 100%,0 94%,1% 90%);background:linear-gradient(rgba(0,0,0,var(--sh)),rgba(0,0,0,var(--sh))),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.3)),radial-gradient(55% 45% at 40% 40%,var(--tree-hi),transparent 70%),repeating-linear-gradient(118deg,transparent 0 7px,rgba(255,255,255,.04) 7px 8px),repeating-linear-gradient(62deg,transparent 0 7px,rgba(0,0,0,.07) 7px 8px),linear-gradient(100deg,var(--tree2) 0%,var(--tree) 50%,var(--tree3) 100%)}
.t1{top:4%;width:46%;height:32%;z-index:3}.t2{top:20%;width:66%;height:36%;z-index:2}.t3{top:38%;width:86%;height:44%;z-index:1}
.t1 b{--sh:0}.t2 b{--sh:.08}.t3 b{--sh:.16}
.trunk{position:absolute;left:50%;top:78%;width:10%;height:11%;transform:translateX(-50%);border-radius:2px 2px 4px 4px;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.2) 3px 4px,transparent 4px 7px),linear-gradient(90deg,#3e2416,#8a5836 40%,#6b4027 70%,#3a2214);box-shadow:inset 0 7px 6px rgba(0,0,0,.45)}
.skirt{position:absolute;left:50%;top:85%;width:52%;height:9%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--skirt2),var(--skirt) 65%);box-shadow:inset 0 -3px 0 rgba(255,255,255,.75),0 8px 14px rgba(0,0,0,.35)}
.garland{position:absolute;inset:0;width:100%;height:100%;z-index:4;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 2px var(--glow-a))}
.garland path{fill:none;stroke-linecap:round}
.garland .gb{stroke:var(--gold);stroke-width:1.6;opacity:.22}
.garland .gd{stroke:var(--gold);stroke-width:1.15;stroke-dasharray:0 2.3}
.garland .gw{stroke:rgba(0,0,0,.5);stroke-width:.35}
.lights{position:absolute;inset:0;z-index:5;pointer-events:none}
.light{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:currentColor;box-shadow:0 0 3px 1px currentColor,0 0 11px 3px currentColor;animation:blink 2.4s ease-in-out infinite}
.light:before{content:"";position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,currentColor 0,transparent 65%);opacity:.45}
.light:after{content:"";position:absolute;left:1.5px;top:1px;width:3px;height:2.5px;border-radius:50%;background:#fff;opacity:.85}
.l0{color:var(--l0)}.l1{color:var(--l1);animation-duration:2.9s}.l2{color:var(--l2);animation-duration:2s}
.spark{position:absolute;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--glow);animation:twinkle 3s ease-in-out infinite}
.spark:before,.spark:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1px;margin:-.5px 0 0 -7px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.spark:after{transform:rotate(90deg)}
.star{position:absolute;left:50%;top:-6%;width:15%;aspect-ratio:1;transform:translateX(-50%);z-index:6;filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 16px var(--glow-a));animation:pulse 2.4s ease-in-out infinite}
.star:before{content:"";position:absolute;inset:-70%;border-radius:50%;opacity:.7;background:repeating-conic-gradient(var(--glow-a) 0 3deg,transparent 3deg 22.5deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:spin 18s linear infinite}
.star .ic{position:relative;display:block;width:100%;height:100%}
.pres{position:absolute;z-index:5;aspect-ratio:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.pres .ic{display:block;width:100%;height:100%}
.p1{left:22%;top:80%;width:15%}.p2{left:62%;top:82%;width:12%}.p3{left:72%;top:87%;width:8.5%}
.orn{position:absolute;z-index:8;width:30px;height:30px;transform:translate(-50%,-50%);transform-origin:50% 0;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));animation:sway 4.5s ease-in-out infinite;animation-delay:var(--d,0s)}
.orn .ic{display:block;width:100%;height:100%}
.orn.o-snow{filter:drop-shadow(0 0 4px var(--flake2)) drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.orn.o-star{filter:drop-shadow(0 0 6px var(--glow-a)) drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.orn.ball{width:24px;height:24px}
.orn.ball,.ball-ic{border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff 0 9%,rgba(255,255,255,.6) 15%,transparent 30%),radial-gradient(circle at 50% 118%,rgba(255,255,255,.45),transparent 45%),radial-gradient(circle at 38% 32%,transparent 30%,rgba(0,0,0,.55) 100%),var(--ball,#e94b58);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 0 12px -2px var(--ball,#e94b58)}
.orn.ball:after,.ball-ic:after{content:"";position:absolute;left:16%;top:20%;width:38%;height:50%;border-radius:50%;border-left:2px solid rgba(255,255,255,.55);transform:rotate(18deg)}
.orn.ball:before{content:"";position:absolute;left:50%;top:-4px;width:8px;height:5px;transform:translateX(-50%);border-radius:2px;background:linear-gradient(90deg,#7a5a1e,var(--gold) 45%,#7a5a1e)}
.ball-ic{--ball:var(--orn-a);position:relative;display:inline-block;width:16px;height:16px;flex:none}
.ic .a{fill:var(--orn-a)}.ic .b{fill:var(--orn-b)}.ic .g{fill:var(--gold)}.ic .w{fill:#fff}.ic .d{fill:#000;opacity:.2}.ic .cf{fill:var(--cream)}
.ic .gs{stroke:var(--gold);stroke-width:2.4;stroke-linejoin:round}
.ic .co,.ic .cw,.ic .cs,.ic .ch,.ic .fl,.ic .fb{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic .co{stroke:rgba(0,0,0,.28);stroke-width:7}.ic .cw{stroke:var(--cream);stroke-width:5.4}
.ic .cs{stroke:var(--orn-a);stroke-width:5.4;stroke-dasharray:2.4 2.6;stroke-linecap:butt}
.ic .ch{stroke:#fff;stroke-width:1.1;opacity:.75}
.ic .fb{stroke:var(--flake2);stroke-width:4.4;opacity:.6}.ic .fl{stroke:var(--flake);stroke-width:2.2}
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tool{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;padding:7px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:12px;white-space:nowrap;cursor:pointer;transition:.2s}
.tool .ic{width:18px;height:18px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.tool:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.tool.active{border-color:var(--accent2);background:linear-gradient(135deg,var(--accent-a),rgba(255,255,255,.08));box-shadow:0 0 0 1px var(--accent-a),0 0 18px var(--accent-a),inset 0 1px rgba(255,255,255,.3)}
.tool.active .ic{filter:drop-shadow(0 0 5px var(--glow))}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.subbtn{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:999px;padding:10px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.subbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
.bi{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.06em}
.field input,.field textarea,.output{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:11px 13px;font:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-a)}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.3)}
.field input[type=file]{padding:8px;font-size:12px;color:var(--muted)}
input[type=file]::file-selector-button{margin-right:10px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.08);color:var(--ink);font:inherit;cursor:pointer}
textarea{resize:vertical;min-height:100px;line-height:1.6}
.themes{display:flex;gap:8px;margin-bottom:4px}
.theme-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;transition:.2s}
.theme-btn .sw{display:flex}
.theme-btn .sw i{width:13px;height:13px;margin:0 -2px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.4),inset 0 -2px 3px rgba(0,0,0,.25)}
.theme-btn.active{border-color:var(--accent2);background:rgba(255,255,255,.1);box-shadow:0 0 16px var(--accent-a),inset 0 1px rgba(255,255,255,.2)}
button.primary{position:relative;overflow:hidden;width:100%;margin-top:4px;border:0;border-radius:999px;padding:14px;font:inherit;font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--on-accent);background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:0 10px 26px var(--accent-a),inset 0 1px rgba(255,255,255,.55),inset 0 -2px rgba(0,0,0,.12);cursor:pointer;transition:transform .15s}
button.primary:after,.letter-btn:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
button.primary:active,.letter-btn:active{transform:scale(.98)}
.error{color:#ff8f8f;font-size:12px;min-height:18px;margin-top:6px}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:18px;letter-spacing:.12em;opacity:.8}
.output-wrap{display:none;margin-top:12px}
.output{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:76px;resize:none;color:var(--muted)}
.preview{display:block;text-align:center;color:var(--accent2);font-size:12px;margin-top:10px;text-decoration:none;letter-spacing:.08em}
.receiver{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px}
.receiver .app{padding:0}
.receiver-sub{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 8px;font:italic 14px/1 Georgia,"Times New Roman",serif;letter-spacing:.3em;text-transform:uppercase;color:var(--accent2);text-shadow:0 0 12px var(--glow-a)}
.receiver-sub:before,.receiver-sub:after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--accent2))}
.receiver-sub:after{transform:scaleX(-1)}
.receiver-title{text-align:center;font-size:24px;margin:0 0 16px;letter-spacing:.12em;text-shadow:0 0 16px var(--glow-a),0 0 36px var(--glow-a),0 2px 0 rgba(0,0,0,.35)}
.letter-btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin:18px auto 0;border:0;border-radius:999px;padding:12px 24px 12px 16px;font:inherit;font-size:15px;font-weight:800;letter-spacing:.08em;color:var(--on-accent);background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:0 10px 28px var(--accent-a),inset 0 1px rgba(255,255,255,.6);cursor:pointer;animation:breathe 2.8s ease-in-out infinite}
.env{width:28px;height:21px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.env .e1{fill:var(--cream)}.env .e2{fill:none;stroke:rgba(80,50,30,.35);stroke-width:1.4;stroke-linejoin:round}.env .e3{fill:var(--seal)}.env .e4{fill:rgba(255,255,255,.5)}
.letter{display:none;position:relative;margin:28px 4px 4px;padding:30px 22px 22px;border-radius:6px 6px 14px 14px;color:#4a3128;font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;font-size:15px;line-height:28px;white-space:pre-wrap;word-break:break-word;background:linear-gradient(transparent 27px,rgba(170,130,90,.3) 27px) 0 0/100% 28px content-box,linear-gradient(170deg,#fffaf0,#f6ead2);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(180,140,80,.18);animation:unfold .55s cubic-bezier(.2,.8,.2,1)}
.letter:before{content:"";position:absolute;left:50%;top:-17px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle at 36% 32%,rgba(255,255,255,.45),transparent 40%),var(--seal);box-shadow:0 0 0 2px var(--seal),0 0 0 3px rgba(0,0,0,.15),inset 0 -3px 5px rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.35)}
.letter:after{content:"";position:absolute;left:50%;top:-7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4)}
.photo{position:relative;display:block;width:min(70%,250px);margin:20px auto 4px;background:#fdfbf6;padding:10px 10px 30px;border-radius:3px;box-shadow:0 14px 32px rgba(0,0,0,.55);transform:rotate(-2.5deg)}
.photo:before{content:"";position:absolute;left:50%;top:-10px;width:80px;height:22px;margin-left:-40px;background:rgba(255,255,255,.45);transform:rotate(3deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px}
.back{text-align:center;margin-top:20px;font-size:13px}
.back a{display:inline-block;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--accent2);text-decoration:none;letter-spacing:.08em}
@keyframes blink{0%,100%{opacity:.5;transform:scale(.82);filter:brightness(.8)}45%{opacity:1;transform:scale(1.15);filter:brightness(1.25)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes fall{to{transform:translate3d(var(--dx,0),420px,0)}}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
@keyframes breathe{50%{box-shadow:0 10px 36px var(--accent-a),0 0 0 6px rgba(255,255,255,.07),inset 0 1px rgba(255,255,255,.6)}}
@keyframes unfold{from{opacity:0;transform:translateY(-10px) scaleY(.92)}to{opacity:1;transform:none}}
@media(max-width:360px){.brand h1{font-size:20px;letter-spacing:.08em}.tool{font-size:11px;gap:3px}.tool .ic{width:16px;height:16px}}
@media(prefers-reduced-motion:reduce){.light,.spark,.star,.star:before,.orn,button.primary:after,.letter-btn,.letter-btn:after{animation:none!important}}
</style></head>
<body><main id="root"></main>
<script>
const ALPHABET='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let state={v:1,theme:'classic',to:'',from:'',letter:'',photo:'',ornaments:[]};let selected='ball';
function enc(s){return btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(x){try{return JSON.parse(decodeURIComponent(escape(atob(x.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-x.length%4)%4)))))}catch(e){return null}}
function validKey(k){const m=k.trim().match(/^XT-([A-Z0-9]{6})$/);if(!m)return false;const a=m[1];if([...a].some(c=>!ALPHABET.includes(c)))return false;let sum=0;for(let i=0;i<5;i++)sum+=(i+1)*ALPHABET.indexOf(a[i]);return sum%31===ALPHABET.indexOf(a[5])}
function themeApply(t){document.body.className=t==='classic'?'':t;state.theme=t;document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===t))}

/* ---------- 视觉：SVG 图标 ---------- */
const ARM='M16 3v26M12.6 5.6 16 9l3.4-3.4M12.6 26.4 16 23l3.4 3.4';
const ARMS=[0,60,120].map(r=>`<path transform="rotate(${r} 16 16)" d="${ARM}"/>`).join('');
const CANE='M12 28.5V11.5a5 5 0 0 1 10 0v1.5';
const ICON={
bell:`<circle class="g" cx="16" cy="27" r="2.6"/><circle class="d" cx="16" cy="27" r="2.6"/><path class="g" d="M16 4.5c-5.2 0-8.6 4-8.6 9.6v5.6L5 23.6v1.9h22v-1.9l-2.4-3.9v-5.6c0-5.6-3.4-9.6-8.6-9.6z"/><path class="d" d="M24.6 19.7v-5.6c0-4.6-2.3-8.1-6-9.2 2.2 1.9 3.2 5 3.2 9.2v6.2l2.2 3.5H27z"/><rect class="d" x="5" y="23.6" width="22" height="1.9" rx=".9"/><path class="w" opacity=".6" d="M11 19c0-5.6 1.6-9.2 5-10.6-2.7.3-5.6 2.6-5.6 7.8V19z"/><path class="a" d="M16 5.5c-1.8-2.6-5.6-2.8-5.4-.6.2 1.8 3 1.6 5.4.6zc1.8-2.6 5.6-2.8 5.4-.6-.2 1.8-3 1.6-5.4.6z"/><circle class="a" cx="16" cy="5.4" r="1.4"/>`,
gift:`<rect class="b" x="5" y="13" width="22" height="15.5" rx="2.6"/><rect class="d" x="5" y="13" width="22" height="3.2"/><rect class="b" x="3.5" y="9.5" width="25" height="5.5" rx="2"/><rect class="g" x="14" y="9.5" width="4" height="19"/><rect class="d" x="16.6" y="15" width="1.4" height="13.5"/><path class="g" d="M16 9.8c-1.6-4.6-7.4-6.6-8.3-3.6-.7 2.5 3.8 3.6 8.3 3.6zc1.6-4.6 7.4-6.6 8.3-3.6.7 2.5-3.8 3.6-8.3 3.6z"/><rect class="w" opacity=".55" x="6" y="10.6" width="6" height="1.5" rx=".75"/><rect class="w" opacity=".3" x="7" y="17" width="1.6" height="9" rx=".8"/>`,
candy:`<path class="co" d="${CANE}"/><path class="cw" d="${CANE}"/><path class="cs" d="${CANE}"/><path class="ch" d="M10.8 26V12a5 5 0 0 1 2.4-4.3"/>`,
star:`<path class="g gs" d="M16 2.5L19.6 11.5 29.3 12.2 21.9 18.4 24.2 27.8 16 22.7 7.8 27.8 10.1 18.4 2.7 12.2 12.4 11.5Z"/><path class="d" d="M16 16.5L29.3 12.2 21.9 18.4 24.2 27.8 16 22.7Z"/><path class="w" opacity=".6" d="M16 5.5L18.4 11.9 16 15.5 13.2 12.5Z"/>`,
snow:`<g class="fb">${ARMS}</g><g class="fl">${ARMS}</g><circle class="w" cx="16" cy="16" r="2"/>`,
sock:`<path class="a" d="M10.5 8h11v11.4c0 1.1-.3 2.1-1 3l-3.3 4.4a5.6 5.6 0 0 1-9-6.6l2.3-3V8z"/><path class="d" d="M21.5 8v11.4c0 1.1-.3 2.1-1 3l-3.3 4.4a5.6 5.6 0 0 1-2.6 1.9c2-2 4-4.6 4.7-6.4.4-1 .5-1.8.5-2.9V8z"/><path class="g" d="M10.5 13h11v2.6h-11z"/><rect class="w" opacity=".45" x="12.4" y="17" width="1.6" height="5" rx=".8"/><rect class="cf" x="8.5" y="3.5" width="15" height="6.5" rx="3.2"/><rect class="d" x="8.5" y="7.6" width="15" height="2.4" rx="1.2"/><rect class="w" opacity=".7" x="10.5" y="4.6" width="5" height="1.3" rx=".65"/>`,
bow:`<path class="a" d="M14.6 15.5 9.8 27l3.4-.9 1.9 2.7 2-13.3z"/><path class="a" d="M17.4 15.5 22.2 27l-3.4-.9-1.9 2.7-2-13.3z"/><path class="d" d="M17.4 15.5 22.2 27l-3.4-.9-1.9 2.7-2-13.3z"/><path class="a" d="M16 14C12.5 8.5 4.5 6.5 4 11.6c-.4 4.4 6.6 5 12 2.4z"/><path class="a" d="M16 14c3.5-5.5 11.5-7.5 12-2.4.4 4.4-6.6 5-12 2.4z"/><path class="d" d="M16 14c-2.5-1-6-1.4-9-.6 2.2 1.6 5.6 1.8 9 .6zc2.5-1 6-1.4 9-.6-2.2 1.6-5.6 1.8-9 .6z"/><rect class="a" x="13.2" y="11.2" width="5.6" height="5.6" rx="2.2"/><rect class="d" x="13.2" y="14" width="5.6" height="2.8" rx="1.4"/><path class="w" opacity=".6" d="M6.2 10.6c1.4-1.8 4.6-.6 7 2.2-2.8-1.2-5.4-1.8-7-2.2z"/><path class="w" opacity=".5" d="M20 10.4c1.8-1.2 4.6-1.6 5.6-.2-1.8-.2-3.6 0-5.6.2z"/>`
};
const hasIcon=t=>Object.prototype.hasOwnProperty.call(ICON,t);
function svg(t){return hasIcon(t)?`<svg class="ic" viewBox="0 0 32 32" aria-hidden="true">${ICON[t]}</svg>`:''}
const MINI=`<svg class="mini" viewBox="0 0 24 28" aria-hidden="true"><path class="m1" d="M12 3 18 11h-3l5 7h-3.5l5 6.5h-19L7.5 18H4l5-7H6z"/><rect class="m3" x="10.5" y="24.5" width="3" height="3" rx=".6"/><circle class="m2" cx="12" cy="3" r="2.3"/><circle class="m4" cx="9.5" cy="15" r="1.1"/><circle class="m5" cx="14.5" cy="19.5" r="1.1"/><circle class="m6" cx="12.5" cy="10" r="1"/></svg>`;
const ENV=`<svg class="env" viewBox="0 0 30 22" aria-hidden="true"><rect class="e1" x="1" y="1" width="28" height="20" rx="3"/><path class="e2" d="M2.5 3.5 15 13l12.5-9.5"/><circle class="e3" cx="15" cy="12.5" r="3.8"/><circle class="e4" cx="13.8" cy="11.3" r="1.1"/></svg>`;
const BI={undo:'<svg class="bi" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',clear:'<svg class="bi" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>',copy:'<svg class="bi" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>'};

/* ---------- 视觉：场景几何（树坐标系 0-100） ---------- */
const ARCS=[[41,16,51,24,60,19,5],[32,40,50,50,69,42,7],[25,63,50,74,76,65,9]];
const BEADS=[[34,27,50,35,66,29],[24,49,50,63,76,52],[17,72,50,86,83,74]];
const TIERS=[[4,46,32],[20,66,36],[38,86,44]];
function qp(a,t){const u=1-t;return[u*u*a[0]+2*u*t*a[2]+t*t*a[4],u*u*a[1]+2*u*t*a[3]+t*t*a[5]]}
const P=a=>`M${a[0]} ${a[1]}Q${a[2]} ${a[3]} ${a[4]} ${a[5]}`;
const GROUND=`<svg class="ground" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true"><path class="s3" d="M0 40C60 16 120 30 180 26 250 20 320 6 400 30V100H0z"/><path class="s2" d="M0 58C70 34 140 52 210 44 280 36 330 30 400 50V100H0z"/><path class="s1" d="M0 78C80 60 160 76 240 68 310 62 360 66 400 74V100H0z"/></svg>`;

function snow(){return Array.from({length:30},()=>{const s=(2+Math.random()*3.5).toFixed(1);return `<i class="snowflake" style="left:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s}px;opacity:${(.4+Math.random()*.6).toFixed(2)};--dx:${Math.round(Math.random()*40-20)}px;animation-duration:${(6+Math.random()*8).toFixed(1)}s;animation-delay:${(-Math.random()*12).toFixed(1)}s"></i>`}).join('')}
function scene(edit=true){
let k=0,lights='',sp='';
ARCS.forEach(a=>{for(let j=0;j<a[6];j++){const p=qp(a,(j+.5)/a[6]);lights+=`<i class="light l${k%3}" style="left:${p[0].toFixed(1)}%;top:${(p[1]+1.8).toFixed(1)}%;animation-delay:-${(k*.53%2.4).toFixed(2)}s"></i>`;k++}});
TIERS.forEach((t,i)=>[-1,1].forEach(s=>[.42,.8].forEach((f,j)=>{sp+=`<i class="spark" style="left:${(50+s*(t[1]/2*f-2)).toFixed(1)}%;top:${(t[0]+t[2]*f).toFixed(1)}%;animation-delay:-${((i*5+j*3+(s>0?2:0))*.41%3).toFixed(2)}s"></i>`})));
const garland=`<svg class="garland" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${BEADS.map(a=>`<path class="gb" d="${P(a)}"/><path class="gd" d="${P(a)}"/>`).join('')}${ARCS.map(a=>`<path class="gw" d="${P(a)}"/>`).join('')}</svg>`;
const os=state.ornaments.map((o,i)=>{const t=o.t==='ball'||hasIcon(o.t)?o.t:'x';return `<span class="orn o-${t}${t==='ball'?' ball':''}" style="left:${o.x/10}%;top:${o.y/10}%;${o.c?`--ball:${o.c};`:''}--d:-${(i*.77%4.5).toFixed(2)}s">${t==='ball'?'':svg(t)}</span>`}).join('');
return `<div class="scene-wrap" id="scene">${GROUND}${snow()}<div class="tree"><div class="skirt"></div><div class="trunk"></div><div class="tier t3"><b></b></div><div class="tier t2"><b></b></div><div class="tier t1"><b></b></div>${garland}<div class="lights">${lights}${sp}</div><div class="star">${svg('star')}</div><span class="pres p1" style="--orn-b:var(--orn-a)">${svg('gift')}</span><span class="pres p2">${svg('gift')}</span><span class="pres p3" style="--orn-b:var(--flake);--gold:var(--orn-a)">${svg('gift')}</span></div>${os}</div>`}

const TOOLS=[['ball','彩球'],['bell','铃铛'],['gift','礼物'],['candy','糖果杖'],['star','星星'],['snow','雪花'],['sock','袜子'],['bow','蝴蝶结']];
const THEMES=[['classic','经典红绿金',['#e23d4f','#2f9d66','#f6c85f']],['ice','冰晶蓝白',['#4fc0ef','#e8fbff','#2b78b8']],['purple','暗夜紫金',['#c05cf5','#ffd26e','#3b246f']]];
function renderEditor(){root.innerHTML=`<div class="app"><header class="brand"><h1>${MINI}<span>给 TA 装饰一棵圣诞树</span></h1><p>把祝福挂上枝头，再交给重要的人</p></header><section class="panel">${scene()}<div class="toolbar">${TOOLS.map(x=>`<button class="tool ${x[0]===selected?'active':''}" data-o="${x[0]}">${x[0]==='ball'?'<i class="ball-ic"></i>':svg(x[0])}<span>${x[1]}</span></button>`).join('')}</div><div class="actions"><button class="subbtn" id="undo">${BI.undo}撤销</button><button class="subbtn" id="clear">${BI.clear}清空装饰</button></div></section><section class="panel"><div class="themes">${THEMES.map(x=>`<button class="theme-btn ${state.theme===x[0]?'active':''}" data-t="${x[0]}"><span class="sw">${x[2].map(c=>`<i style="background:${c}"></i>`).join('')}</span>${x[1]}</button>`).join('')}</div><div class="row"><div class="field"><label>送给 TA 的名字</label><input id="to" value="${state.to}" placeholder="例如：小禾"></div><div class="field"><label>我的名字</label><input id="from" value="${state.from}" placeholder="例如：阿野"></div></div><div class="field"><label>写一封信</label><textarea id="letter" placeholder="把想说的话写下来…">${state.letter}</textarea></div><div class="field"><label>照片（可选）</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>卡密</label><input id="key" placeholder="XT-XXXXXX"><div class="error" id="err"></div></div><button class="primary" id="generate">生成专属链接</button><div class="output-wrap" id="outwrap"><textarea class="output" id="out" readonly></textarea><button class="subbtn" id="copy" style="width:100%;margin-top:8px">${BI.copy}复制链接</button><a class="preview" id="preview" target="_blank">打开预览 →</a></div></section><p class="hint">链接自包含 · 永不过期 · 不经过任何服务器</p></div>`;bindEditor()}
function bindEditor(){const sceneEl=document.getElementById('scene');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{selected=b.dataset.o;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('.theme-btn').forEach(b=>b.onclick=()=>{themeApply(b.dataset.t);renderEditor()});sceneEl.onclick=e=>{if(e.target.closest('.orn'))return;const r=sceneEl.getBoundingClientRect();const o={t:selected,x:Math.round((e.clientX-r.left)/r.width*1000),y:Math.round((e.clientY-r.top)/r.height*1000)};if(selected==='ball')o.c=['#e94b58','#f2c14e','#4fc3f7','#b56cff'][state.ornaments.length%4];state.ornaments.push(o);renderEditor()};undo.onclick=()=>{state.ornaments.pop();renderEditor()};clear.onclick=()=>{state.ornaments=[];renderEditor()};photo.onchange=e=>{const f=e.target.files[0];if(!f)return;resizePhoto(f,480,.6,d=>state.photo=d)};generate.onclick=()=>{state.to=to.value.trim();state.from=from.value.trim();state.letter=letter.value;const k=key.value;err.textContent='';key.style.borderColor='';if(!validKey(k)){err.textContent='卡密不对，检查一下或联系卖家';key.style.borderColor='#ff6b6b';return}let u=location.href.split('#')[0]+'#d='+enc(state);if(u.length>50000&&state.photo){resizePhoto(null,360,.5,d=>{state.photo=d;out.value=location.href.split('#')[0]+'#d='+enc(state);preview.href=out.value});}out.value=u;preview.href=u;outwrap.style.display='block'};copy.onclick=()=>{navigator.clipboard?.writeText(out.value).catch(()=>{});out.select();document.execCommand('copy')}}
function resizePhoto(file,max,q,cb){if(!file){const i=new Image();i.onload=()=>draw(i,max,q,cb);i.src=state.photo;return}const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>draw(i,max,q,cb);i.src=r.result};r.readAsDataURL(file)}function draw(i,max,q,cb){const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))}
function renderReceiver(){const bad=!state;root.innerHTML=`<div class="receiver"><div class="app">${bad?'':'<p class="receiver-sub">Merry Christmas</p>'}<h1 class="receiver-title">${bad?'链接好像不完整':`送给 ${state.to||'你'} 的圣诞树`}</h1>${bad?'':`<section class="panel">${scene(false)}${state.photo?`<div class="photo"><img src="${state.photo}"></div>`:''}<button class="letter-btn" id="letterBtn">${ENV}<span>点开 TA 写给你的信</span></button><div class="letter" id="letterPanel">${state.letter||'愿你的每一天都有微小的闪光。'}<br><br>—— ${state.from||'送礼人'}</div></section>`}<p class="back"><a href="${location.href.split('#')[0]}">我也送一棵 →</a></p></div></div>`;if(!bad)letterBtn.onclick=()=>{letterPanel.style.display=letterPanel.style.display==='block'?'none':'block'}}
const hash=location.hash.match(/^#d=(.+)$/);if(hash){const d=dec(hash[1]);if(d){Object.assign(state,d);themeApply(state.theme);renderReceiver()}else{state=null;renderReceiver()}}else renderEditor();
</script></body></html>
